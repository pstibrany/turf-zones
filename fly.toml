app = "turf-exporter"
primary_region = "arn"

[build]

[env]
  TURF_LISTEN = ":8080"
  TURF_DB_PATH = "/data/turf.db"
  # Region 172, Hovedstaden.
  TURF_TURF_COUNTRIES = "dk"
  TURF_TURF_REGIONS = "172"
  TURF_LOG_FORMAT = "json"
  # Always tracked, whether or not they make the top list.
  TURF_PLAYERS = "hula,Alanda"

# TURF_API_TOKEN guards /api/* and is deliberately NOT set here: this file is
# committed, and a secret in git stays in git. Set it out of band, which also
# avoids it ever being displayed:
#
#   fly secrets set TURF_API_TOKEN=$(openssl rand -hex 32)
#
# Leaving it unset keeps /api/* open, which is fine while the app has no public
# service and is only reachable on the Fly private network.

# SQLite lives here. 1 GB is far more than the takeover history needs; it is the
# smallest size worth asking for.
[[mounts]]
  source = "turf_data"
  destination = "/data"

# Telemetry lives on 9090, which is deliberately absent from [http_service] and
# therefore never published. Fly's managed Prometheus reaches it over the private
# network; the internet cannot. That is why /metrics needs no token.
# Look at it locally with:  fly proxy 9090:9090
[metrics]
  port = 9090
  path = "/metrics"

# One machine, always on. The Turf API's rate limit is one request per second per
# source, and the exporter's limiter assumes it is the only client — a second
# machine would double the request rate and trip it. Never `fly scale count > 1`.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

# Public endpoint at https://turf-exporter.fly.dev. Publishing a port exposes all
# of it, not selected paths, so only the public listener is here: the status page
# and the bearer-token guarded /api/*. Metrics are on the unpublished port above.
#
# auto_stop must stay false: this is a poller, not a request-driven service, and
# a stopped machine silently stops collecting.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
